<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة صالة البلايستيشن - Mostafa Yosef</title>
    
    <!-- مكتبات Firebase السحابية -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text-color: #f8fafc;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --accent: #2563eb;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
            gap: 10px;
        }

        h1 { margin: 0; color: var(--accent); }
        .author-tag { color: #94a3b8; font-size: 0.9rem; }

        .top-tools {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--accent);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .tool-btn.danger {
            border-color: var(--danger);
            color: var(--danger);
        }

        .month-selector-bar {
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .month-selector-bar select {
            padding: 8px 12px;
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--accent);
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--accent);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .tab-btn.active { background: var(--accent); color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .device-title { font-size: 1.4rem; color: #38bdf8; text-align: center; font-weight: bold; }
        
        .rate-box {
            background: var(--input-bg);
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .rate-box input {
            width: 60px;
            padding: 4px;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
        }

        .timer-display { font-size: 2.2rem; font-family: monospace; text-align: center; margin: 10px 0; color: #fde047; }
        .timer-display.finished { color: var(--danger); animation: blink 1s infinite; }

        @keyframes blink { 50% { opacity: 0.3; } }

        .btn-group { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px; }
        .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #fff; }
        .btn-start { background: var(--success); }
        .btn-stop { background: var(--danger); }
        .btn-add { background: var(--warning); color: #000; }

        .controls-box {
            background: var(--input-bg);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 0.9rem;
        }

        .controls-box input {
            width: 50px;
            padding: 4px;
            text-align: center;
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .item-inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .item-inputs input {
            width: 60px;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
        }

        .bill-preview {
            background: var(--input-bg);
            padding: 10px;
            border-radius: 8px;
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
            color: #38bdf8;
            border: 1px dashed #38bdf8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
        }

        th { background: #0284c7; color: #fff; }

        .inventory-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
            flex-wrap: wrap;
            background: var(--input-bg);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stats-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }
        .stats-box h3 { color: #38bdf8; margin-top: 0; }
        .money-display { font-size: 2rem; font-weight: bold; color: #22c55e; }
        
        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            background: #22c55e;
            color: white;
            font-weight: bold;
        }

        /* نافذة التنبيه المودال للمنبه المتكرر */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            display: none;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid var(--danger);
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
        .modal-content h2 { color: var(--danger); margin-top: 0; }
    </style>
</head>
<body>

    <div class="header-container">
        <div>
            <h1>🎮 نظام إدارة محل البلايستيشن</h1>
            <div class="author-tag">Developed by Mostafa Yosef <span class="status-badge" id="cloud-status">☁️ متصل</span></div>
        </div>
        <div class="top-tools">
            <button class="tool-btn" onclick="toggleTheme()" id="theme-btn">🌙 المظهر الداكن</button>
            <button class="tool-btn danger" onclick="resetTodayData()">🗑️ تصفير اليوم الحالي</button>
            <button class="tool-btn danger" onclick="resetActiveMonth()">🧹 تصفير الشهر</button>
            <button class="tool-btn danger" onclick="resetAllSystem()">⚠️ تصفير كامل</button>
            <button class="tool-btn" onclick="exportData()">📥 تصدير</button>
            <button class="tool-btn" onclick="document.getElementById('import-file').click()">📤 استيراد</button>
            <input type="file" id="import-file" style="display:none;" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <!-- شريط اختيار الشهر والسنة -->
    <div class="month-selector-bar">
        <div>
            <span style="font-size: 1.1rem; font-weight: bold; color: #38bdf8;">📅 اختر الشهر المطلوب: </span>
            <select id="month-select" onchange="changeActiveMonth()">
                <option value="2026-1">يناير 2026</option>
                <option value="2026-2">فبراير 2026</option>
                <option value="2026-3">مارس 2026</option>
                <option value="2026-4">أبريل 2026</option>
                <option value="2026-5">مايو 2026</option>
                <option value="2026-6">يونيو 2026</option>
                <option value="2026-7">يوليو 2026</option>
                <option value="2026-8">أغسطس 2026</option>
                <option value="2026-9">سبتمبر 2026</option>
                <option value="2026-10">أكتوبر 2026</option>
                <option value="2026-11">نوفمبر 2026</option>
                <option value="2026-12">ديسمبر 2026</option>
            </select>
        </div>
        <div id="current-active-indicator" style="font-weight: bold; color: #fde047;"></div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'timers')">⏱️ الأجهزة والمؤقتات</button>
        <button class="tab-btn" onclick="switchTab(event, 'daily')">📅 السجل اليومي</button>
        <button class="tab-btn" onclick="switchTab(event, 'finance')">💰 الخزينة والحسابات</button>
        <button class="tab-btn" onclick="switchTab(event, 'inventory')">📦 الخامات والمشتريات</button>
        <button class="tab-btn" onclick="switchTab(event, 'reports')">📊 جرد الشهر والسنة</button>
    </div>

    <!-- 1. الأجهزة والمؤقتات -->
    <div id="timers" class="tab-content active">
        <div class="grid" id="devices-grid"></div>
    </div>

    <!-- 2. السجل اليومي -->
    <div id="daily" class="tab-content">
        <h2 id="daily-title-text">سجل الإيرادات اليومية للشهر المحدد</h2>
        <table>
            <thead>
                <tr>
                    <th>اليوم</th>
                    <th>البلايستيشن</th>
                    <th>المشروبات</th>
                    <th>الأندومي</th>
                    <th>البقالة</th>
                    <th>الإجمالي اليومي</th>
                </tr>
            </thead>
            <tbody id="daily-table-body"></tbody>
        </table>
    </div>

    <!-- 3. الخ
