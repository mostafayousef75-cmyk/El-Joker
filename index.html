<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة صالة البلايستيشن - Mostafa Yosef</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text-color: #f8fafc;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        h1, h2 { text-align: center; color: var(--accent); }
        .author-tag { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--card-bg);
            color: #fff;
            border: 1px solid var(--accent);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .tab-btn.active { background: var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .device-title { font-size: 1.4rem; color: #38bdf8; text-align: center; font-weight: bold; }
        
        .rate-box {
            background: #0f172a;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .rate-box input {
            width: 60px;
            padding: 4px;
            background: #1e293b;
            color: #fde047;
            border: 1px solid #475569;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
        }

        .timer-display { font-size: 2.2rem; font-family: monospace; text-align: center; margin: 10px 0; color: #fde047; }
        .timer-display.finished { color: var(--danger); animation: blink 1s infinite; }

        @keyframes blink { 50% { opacity: 0.3; } }

        .btn-group { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-bottom: 15px; }
        .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #fff; }
        .btn-start { background: var(--success); }
        .btn-stop { background: var(--danger); }
        .btn-add { background: var(--warning); color: #000; }
        .btn-timer { background: #8b5cf6; }

        .controls-box {
            background: #0f172a;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 0.9rem;
        }

        .controls-box input {
            width: 50px;
            padding: 4px;
            text-align: center;
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 4px;
        }

        .item-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .item-inputs input {
            width: 70%;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
        }

        .bill-preview {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
            color: #38bdf8;
            border: 1px dashed #38bdf8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #334155;
            padding: 10px;
            text-align: center;
        }

        th { background: #0284c7; color: #fff; }
        
        .add-input-group {
            display: flex;
            gap: 4px;
            justify-content: center;
            align-items: center;
        }
        .add-input-group input {
            width: 50px;
            padding: 4px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            text-align: center;
            border-radius: 4px;
        }
        .action-btn {
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            color: white;
        }
        .btn-plus { background: #10ac84; }
        .btn-minus { background: #ee5253; }

        .inventory-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .inventory-row input {
            padding: 8px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 6px;
        }

        .stats-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .stats-box h3 { color: #38bdf8; margin-top: 0; }
        .money-display { font-size: 2rem; font-weight: bold; color: #22c55e; }
    </style>
</head>
<body>

    <h1>🎮 نظام إدارة محل البلايستيشن</h1>
    <div class="author-tag">Developed by Mostafa Yosef</div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('timers')">⏱️ الأجهزة والمؤقتات</button>
        <button class="tab-btn" onclick="switchTab('daily')">📅 السجل اليومي (+ و -)</button>
        <button class="tab-btn" onclick="switchTab('finance')">💰 الخزينة والحسابات</button>
        <button class="tab-btn" onclick="switchTab('inventory')">📦 الخامات والحرة</button>
        <button class="tab-btn" onclick="switchTab('reports')">📊 جرد الشهر والسنة</button>
    </div>

    <!-- 1. الأجهزة والمؤقتات -->
    <div id="timers" class="tab-content active">
        <div class="grid" id="devices-grid"></div>
    </div>

    <!-- 2. السجل اليومي -->
    <div id="daily" class="tab-content">
        <h2>سجل الإيرادات اليومية (إضافة أو خصم)</h2>
        <table>
            <thead>
                <tr>
                    <th>اليوم</th>
                    <th>البلايستيشن</th>
                    <th>المشروبات</th>
                    <th>الأندومي</th>
                    <th>البقالة</th>
                    <th>أخرى</th>
                    <th>الإجمالي اليومي</th>
                </tr>
            </thead>
            <tbody id="daily-table-body"></tbody>
        </table>
    </div>

    <!-- 3. الخزينة والماليات -->
    <div id="finance" class="tab-content">
        <div class="stats-box">
            <h3>💰 صافي الخزينة الحالية</h3>
            <div class="money-display" id="net-cash">0 ج.م</div>
        </div>

                <input type="number" id="in-amount" placeholder="المبلغ" style="width:90%; padding:8px; margin-bottom:10px; background:#0f172a; color:#fff; border:1px solid #475569; border-radius:6px;">
                <button class="btn btn-start" style="width:100%;" onclick="addFinance('in')">إضافة للوارد</button>
            </div>
            <div class="card">
                <h3>📤 تسجيل منصرف (أموال خارجة)</h3>

                <input type="number" id="out-amount" placeholder="المبلغ" style="width:90%; padding:8px; margin-bottom:10px; background:#0f172a; color:#fff; border:1px solid #475569; border-radius:6px;">
