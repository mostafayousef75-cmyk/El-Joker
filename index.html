<div class="purchases-section" style="background: #1e293b; padding: 20px; border-radius: 12px; margin-top: 20px; color: #fff;">
    <h3>🛒 إدارة الخامات والمشتريات</h3>
    
    <!-- نموذج تسجيل عملية شراء جديدة -->
    <form id="purchaseForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px;">
        <input type="text" id="pItemName" placeholder="اسم الخامة / الصنف" required style="padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;">
        <select id="pCategory" style="padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;">
            <option value="مشروبات">مشروبات</option>
            <option value="أندومي">أندومي</option>
            <option value="بقالة وسناكس">بقالة وسناكس</option>
            <option value="خامات وصيانة">خامات وصيانة صالة</option>
        </select>
        <input type="number" id="pQuantity" placeholder="الكمية" required style="padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;">
        <input type="number" id="pCost" placeholder="إجمالي التكلفة (جنية)" required style="padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;">
        <button type="submit" style="background: #22c55e; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">إضافة الشراء</button>
    </form>

    <!-- جدول عرض المشتريات والتحكم بها -->
    <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; text-align: right;">
            <thead>
                <tr style="border-bottom: 2px solid #475569; color: #94a3b8;">
                    <th style="padding: 10px;">التاريخ</th>
                    <th style="padding: 10px;">الصنف</th>
                    <th style="padding: 10px;">التصنيف</th>
                    <th style="padding: 10px;">الكمية</th>
                    <th style="padding: 10px;">التكلفة</th>
                    <th style="padding: 10px;">إجراءات</th>
                </tr>
            </thead>
            <tbody id="purchasesTableBody">
                <!-- سيتم تعبئتها ديناميكياً من Firebase -->
            </tbody>
        </table>
    </div>
</div>

<!-- Modal تعديل عملية شراء (مخفي افتراضياً) -->
<div id="editPurchaseModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center;">
    <div style="background:#1e293b; padding:20px; border-radius:10px; width:300px;">
        <h4>تعديل عملية الشراء</h4>
        <input type="hidden" id="editPurchaseId">
        <input type="text" id="editPItemName" placeholder="الصنف" style="width:100%; margin-bottom:10px; padding:8px; background:#0f172a; color:#fff; border:1px solid #475569;">
        <input type="number" id="editPQuantity" placeholder="الكمية" style="width:100%; margin-bottom:10px; padding:8px; background:#0f172a; color:#fff; border:1px solid #475569;">
        <input type="number" id="editPCost" placeholder="التكلفة" style="width:100%; margin-bottom:10px; padding:8px; background:#0f172a; color:#fff; border:1px solid #475569;">
        <button onclick="saveEditedPurchase()" style="background:#3b82f6; color:#fff; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">حفظ التعديل</button>
        <button onclick="closeEditModal()" style="background:#ef4444; color:#fff; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; margin-right:5px;">إلغاء</button>
    </div>
</div>
